name: Publish GitHub Package

on:
    release:
        types: [created]

# packages to publish with the workflow's own token. No OIDC exchange happens here, so no id-token.
permissions:
    contents: read
    packages: write

jobs:
    publish-github-package:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: https://npm.pkg.github.com/
                  scope: "@arkitektum"

            # A release whose tag does not name the version in package.json would publish that version under the wrong
            # release, or fail at the registry after everything else has run, so it stops here first.
            - name: Check that the release tag matches package.json
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$version" ]; then
                    echo "::error::The release is tagged $TAG, but package.json says $version."
                    exit 1
                  fi

            # Ensure Yarn v4 from packageManager is used
            - name: Enable Corepack and activate Yarn 4
              run: |
                  corepack enable
                  yarn --version

            # A registry timeout can crash Yarn outright instead of failing one fetch, so retry the whole install rather than trusting Yarn's own retries to recover.
            - name: Install dependencies
              run: |
                  for attempt in 1 2 3; do
                      yarn install --immutable && exit 0
                      echo "::warning::yarn install failed (attempt $attempt/3), retrying in 15s"
                      sleep 15
                  done
                  exit 1

            - run: yarn typecheck
            - run: yarn test
            - run: yarn build

            # The workflow's own token, rather than a secret that has to be created and rotated per repository. It can write
            # packages because the job asks for `packages: write` above, and it is scoped to this repository, which is where
            # the package belongs.
            - name: Publish to GitHub Packages
              if: ${{ success() }}
              run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
