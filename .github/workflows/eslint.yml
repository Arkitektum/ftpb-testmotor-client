name: ESLint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "40 8 * * 3"

jobs:
  eslint:
    name: Run ESLint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack and activate Yarn 4
        run: |
          corepack enable
          yarn --version

      # A registry timeout can crash Yarn outright instead of failing one fetch, so retry the whole install rather than trusting Yarn's own retries to recover.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
              yarn install --immutable && exit 0
              echo "::warning::yarn install failed (attempt $attempt/3), retrying in 15s"
              sleep 15
          done
          exit 1

      # Only the formatter is added here, and with --no-save so it cannot touch yarn.lock: Yarn makes installs immutable when CI is set, and a lockfile change would fail the run. ESLint and typescript-eslint come from the install above, so the scan uses the same versions as `yarn lint` rather than whatever npx would fetch.
      - name: Install the SARIF formatter
        run: npm install --no-save @microsoft/eslint-formatter-sarif@3.1.0

      - name: Run ESLint
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: |
          yarn eslint . \
            --config eslint.config.mjs \
            --format @microsoft/eslint-formatter-sarif \
            --output-file eslint-results.sarif || echo "ESLint completed with errors."
        continue-on-error: true

      - name: Check if SARIF exists
        run: |
          if [ ! -f eslint-results.sarif ]; then
            echo "::warning::ESLint produced no SARIF file, so nothing was uploaded. Check the Run ESLint step."
            exit 0
          fi

      - name: Upload analysis results to GitHub
        if: ${{ hashFiles('eslint-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
